<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorAI Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center max-w-5xl mx-auto mt-4 rounded-t-xl shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">M</div>
      <h1 class="font-bold text-lg text-slate-800">MentorAI Sekolah</h1>
    </div>
    <div class="flex gap-2">
      <button id="tabGuruBtn" onclick="switchView('guru')" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-600">Panel Guru</button>
      <button id="tabSiswaBtn" onclick="switchView('siswa')" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Ruang Siswa</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto pb-12">
    <!-- PANEL GURU -->
    <section id="viewGuru" class="bg-white p-8 rounded-b-xl shadow-sm border border-t-0 border-slate-200">
      <h2 class="text-xl font-bold text-slate-900 mb-1">Pengaturan Acuan & Masalah Pemantik</h2>
      <p class="text-sm text-slate-500 mb-6">Tentukan metode, materi pokok, dan tantangan masalah yang akan dipelajari oleh seluruh siswa di kelas ini.</p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Metode Pembelajaran</label>
          <select id="inputMetode" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            <option value="PjBL (Project Based Learning)">PjBL (Project Based Learning)</option>
            <option value="PBL (Problem Based Learning)">PBL (Problem Based Learning)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Topik Utama</label>
          <input id="inputTopik" type="text" placeholder="Contoh: Pembuatan Alat Penjernih Air Sederhana" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-700 mb-1">Materi Pokok / Acuan Belajar</label>
        <textarea id="inputMateri" rows="4" placeholder="Masukkan poin materi pokok..." class="w-full border border-slate-200 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <div class="mb-6">
        <label class="block text-xs font-semibold text-slate-700 mb-1">Permasalahan / Tantangan Proyek</label>
        <textarea id="inputMasalah" rows="3" placeholder="Masukkan skenario masalah atau tantangan proyek..." class="w-full border border-slate-200 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <div class="flex flex-wrap justify-between items-center gap-4">
        <div class="flex gap-2">
          <button type="button" onclick="isiContohPBL()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition">Isi Contoh PBL</button>
          <button type="button" onclick="isiContohPjBL()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition">Isi Contoh PjBL</button>
        </div>
        <button type="button" onclick="simpanDanKirim()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-sm transition cursor-pointer">
          Simpan & Kirim ke Siswa
        </button>
      </div>
    </section>

    <!-- RUANG SISWA (CHATBOT) -->
    <section id="viewSiswa" class="hidden bg-white rounded-b-xl shadow-sm border border-t-0 border-slate-200 flex flex-col h-[600px]">
      <!-- Info Konteks Tugas -->
      <div class="bg-indigo-50/70 border-b border-indigo-100 px-6 py-3 flex justify-between items-center">
        <div>
          <span id="badgeMetode" class="text-[11px] font-bold uppercase tracking-wider bg-indigo-600 text-white px-2 py-0.5 rounded">PjBL</span>
          <h3 id="judulTopikSiswa" class="font-bold text-slate-800 text-sm mt-1">Topik Belum Diatur</h3>
          <p id="teksMasalahSiswa" class="text-xs text-slate-600 mt-0.5">Silakan atur materi di Panel Guru terlebih dahulu.</p>
        </div>
        <button onclick="switchView('guru')" class="text-xs text-indigo-600 hover:underline font-medium">Ubah Pengaturan</button>
      </div>

      <!-- Kotak Pesan -->
      <div id="chatBox" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50/50"></div>

      <!-- Input Pesan -->
      <form id="chatForm" onsubmit="kirimPesan(event)" class="p-4 bg-white border-t border-slate-200 flex gap-2 rounded-b-xl">
        <input id="chatInput" type="text" placeholder="Ketik ide, pertanyaan, atau langkah proyekmu di sini..." class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-600" required />
        <button id="btnKirim" type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition">
          Kirim
        </button>
      </form>
    </section>
  </main>

  <script>
    let learningContext = {
      metode: 'PjBL (Project Based Learning)',
      topik: 'Pembuatan Alat Penjernih Air Sederhana',
      materi: '1. Sifat fisik dan kimia air bersih.\n2. Fungsi filtrasi menggunakan ijuk, kerikil, pasir, dan arang.',
      masalah: 'Rancanglah purwarupa alat penjernih air sederhana dengan memanfaatkan bahan di sekitar.'
    };
    let chatHistory = [];

    function isiContohPjBL() {
      document.getElementById('inputMetode').value = 'PjBL (Project Based Learning)';
      document.getElementById('inputTopik').value = 'Pembuatan Alat Penjernih Air Sederhana';
      document.getElementById('inputMateri').value = '1. Sifat fisik dan kimia air bersih.\n2. Fungsi filtrasi menggunakan ijuk, kerikil, pasir, dan arang.';
      document.getElementById('inputMasalah').value = 'Rancanglah purwarupa alat penjernih air sederhana dengan memanfaatkan bahan di sekitar.';
    }

    function isiContohPBL() {
      document.getElementById('inputMetode').value = 'PBL (Problem Based Learning)';
      document.getElementById('inputTopik').value = 'Pencemaran Lingkungan Sungai';
      document.getElementById('inputMateri').value = '1. Dampak limbah rumah tangga terhadap ekosistem air.\n2. Cara mengidentifikasi parameter pencemaran air.';
      document.getElementById('inputMasalah').value = 'Sungai di dekat pemukiman warga berubah warna dan berbau. Analisis penyebab utama dan rumuskan solusi penanganannya!';
    }

    function switchView(target) {
      const vGuru = document.getElementById('viewGuru');
      const vSiswa = document.getElementById('viewSiswa');
      const bGuru = document.getElementById('tabGuruBtn');
      const bSiswa = document.getElementById('tabSiswaBtn');

      if (target === 'siswa') {
        vGuru.classList.add('hidden');
        vSiswa.classList.remove('hidden');
        bSiswa.className = 'px-4 py-1.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-600';
        bGuru.className = 'px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100';
      } else {
        vSiswa.classList.add('hidden');
        vGuru.classList.remove('hidden');
        bGuru.className = 'px-4 py-1.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-600';
        bSiswa.className = 'px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100';
      }
    }

    function tambahBubble(pengirim, teks) {
      const chatBox = document.getElementById('chatBox');
      const wrapper = document.createElement('div');
      wrapper.className = pengirim === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bubble = document.createElement('div');
      bubble.className = pengirim === 'user'
        ? 'max-w-[75%] bg-indigo-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm text-sm whitespace-pre-wrap shadow-sm'
        : 'max-w-[75%] bg-white border border-slate-200 text-slate-800 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm whitespace-pre-wrap shadow-sm';
      bubble.textContent = teks;

      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function simpanDanKirim() {
      const metode = document.getElementById('inputMetode').value.trim();
      const topik = document.getElementById('inputTopik').value.trim();
      const materi = document.getElementById('inputMateri').value.trim();
      const masalah = document.getElementById('inputMasalah').value.trim();

      if (!topik || !materi || !masalah) {
        alert('Mohon lengkapi Topik Utama, Materi Pokok, dan Permasalahan terlebih dahulu (atau klik tombol Isi Contoh).');
        return;
      }

      learningContext = { metode, topik, materi, masalah };
      document.getElementById('badgeMetode').textContent = metode;
      document.getElementById('judulTopikSiswa').textContent = topik;
      document.getElementById('teksMasalahSiswa').textContent = masalah;

      chatHistory = [];
      document.getElementById('chatBox').innerHTML = '';
      switchView('siswa');

      const sapaanAwal = `Halo! Selamat datang di sesi pembelajaran *${topik}* (${metode}).\n\n**Tantangan Kita:**\n${masalah}\n\nMenurutmu, apa langkah pertama atau bahan utama yang perlu kita siapkan untuk menyelesaikan tantangan ini?`;
      tambahBubble('model', sapaanAwal);
      chatHistory.push({ role: 'model', text: sapaanAwal });
    }

    async function kirimPesan(e) {
      e.preventDefault();
      const inputEl = document.getElementById('chatInput');
      const btnKirim = document.getElementById('btnKirim');
      const pesan = inputEl.value.trim();
      if (!pesan) return;

      tambahBubble('user', pesan);
      inputEl.value = '';
      btnKirim.disabled = true;
      btnKirim.textContent = '...';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: pesan,
            history: chatHistory,
            context: learningContext
          })
        });

        const data = await res.json();
        if (!res.ok) {
          tambahBubble('model', '⚠️ Info Sistem: ' + (data.error || 'Gagal terhubung ke AI.'));
        } else {
          tambahBubble('model', data.reply);
          chatHistory.push({ role: 'user', text: pesan });
          chatHistory.push({ role: 'model', text: data.reply });
        }
      } catch (err) {
        tambahBubble('model', '⚠️ Gagal menghubungi server: ' + err.message);
      } finally {
        btnKirim.disabled = false;
        btnKirim.textContent = 'Kirim';
      }
    }

    // Isi otomatis saat pertama kali dibuka
    isiContohPjBL();
  </script>
</body>
</html>
